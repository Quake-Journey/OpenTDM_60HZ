// OpenTDM 60 Hz (r6010): пример настроек дуэльного сервера 1 на 1.
//
// Скопируйте файл в opentdm\server.cfg, задайте имя сервера и свои пароли
// и запускайте сервер из папки, где лежат q2proded64.exe и baseq2:
//
//   q2proded64.exe +set game opentdm +set net_port 27910 +exec server.cfg
//
// Адрес и порт (net_ip, net_port) удобнее задавать в командной строке, как выше:
// так один файл подходит для нескольких серверов. Строки после // - комментарии.

// ---------- сервер ----------
set hostname "OpenTDM 60 Hz duel"   // имя в списках серверов (короче 64 символов)
set maxclients "16"                 // игроки и зрители вместе
set public "0"                      // 1 - сообщать о сервере мастер-серверам (и добавьте строку setmaster)
// setmaster master.example.net     // адрес мастер-сервера, если public 1
set rcon_password ""                // ЗАДАЙТЕ СВОЙ. Пустой - удалённое управление (rcon) выключено
set sv_password ""                  // пароль на вход; пустой - вход свободный
set logfile "1"                     // журнал консоли: opentdm\logs\console.log
set sv_status_show "2"              // ответ на запрос status: настройки и список игроков

// ---------- частота мира ----------
set sv_fps "60"                     // 10, 20, 30, 40, 50 или 60; другое значение мод не примет
set sys_timerperiod "1"             // Windows: точный таймер, ровные шаги по 16,7 мс (по умолчанию 1)
set sys_nothrottle "1"              // Windows: не замедлять сервер без окна (по умолчанию 1)
set sv_tickdiag "0"                 // диагностика ровности шагов: 1 только на время замера
set sv_packetdup_hack "3"           // сколько повторов пакетов игрок может включить командой packetdup
set sv_allow_timers "1" s           // 1 - клиент Q2PRO-X может сам показывать таймеры предметов, 0 - нельзя

// ---------- дуэль ----------
set deathmatch "1"
set g_gamemode "2"                  // 0 - TDM, 1 - ITDM, 2 - дуэль 1 на 1
set g_1v1flags "16"                 // dmflags дуэли: 16 - предметы сразу; 1040 (по умолчанию) - ещё и принудительное возрождение
set g_itemflags "0"                 // какое оружие убрать с карты (биты); 0 - ничего не убирать
set g_powerupflags "-1"             // какие усилители убрать (биты); -1 - все (квад, неуязвимость и др.), 0 - оставить
set g_match_time "600"              // длина матча, секунд
set g_match_countdown "15"          // отсчёт перед матчем, секунд
set g_tie_mode "1"                  // ничья: 1 - овертайм, 2 - внезапная смерть, 0 - ничья
set g_overtime "60"                 // длина овертайма, секунд
set g_1v1_timeout "90"              // сколько секунд ждать отключившегося соперника
set g_1v1_spawn_mode "2"            // точка появления: 1 - не ближайшая к сопернику, 2 - случайная
set g_intermission_time "5"         // показ табло после матча, секунд
set g_idle_time "180"               // через сколько секунд бездействия убирать игрока из игры
// set g_maplistfile "maps.txt"     // необязательно: файл в папке opentdm со списком карт для голосования, по одной в строке
// set g_motd_message ""            // необязательно: приветствие игрокам

// ---------- демки MVD ----------
// Каждый начавшийся матч пишется в отдельный файл opentdm\demos\<дата>_<время>_<карта>_<A>-vs-<B>_<счёт>_<номер>.mvd2.
// Пока автозапись включена, ручные mvdrecord / mvdstop отклоняются.
set sv_mvd_enable "2"               // 1 - только запись на сервере, 2 - ещё и подключение ретрансляторов GTV
set sv_mvd_password ""              // ЗАДАЙТЕ СВОЙ, если не хотите пускать любые ретрансляторы GTV
set sv_mvd_maxclients "2"           // сколько ретрансляторов GTV можно подключить
set sv_mvd_autorecord_matches "1"   // автозапись каждого матча
set sv_mvd_autorecord "0"           // прежняя автозапись наблюдателя MVD: выключена
set sv_mvd_spawn_dummy "1"          // служебный наблюдатель MVD (нужен для табло в демке)
set sv_mvd_nomsgs "1"

// ---------- старт ----------
map q2dm1
